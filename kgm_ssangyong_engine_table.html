  let currentBrand = "ALL";
  let currentCategory = "ALL";
  let currentFuel = "ALL";
  let currentSearch = "";

  const tbody = document.getElementById("kgm-tbody");
  const noResults = document.getElementById("kgm-no-results");
  const totalCountEl = document.getElementById("kgm-total-count");
  const searchInput = document.getElementById("kgm-search");

  function getBrandBadge(brand) {
    if (brand.includes("KGM")) return '<span class="kgm-badge badge-kgm">' + brand + '</span>';
    return '<span class="kgm-badge badge-ssangyong">' + brand + '</span>';
  }

  function getFuelBadge(fuel) {
    let cls = "fuel-diesel";
    if (fuel.includes("가솔린")) cls = "fuel-gasoline";
    else if (fuel.includes("LPG") || fuel.includes("바이퓨얼")) cls = "fuel-lpg";
    else if (fuel.includes("전기")) cls = "fuel-ev";
    return '<span class="kgm-badge ' + cls + '">' + fuel + '</span>';
  }

  function render() {
    const searchVal = currentSearch.trim().toLowerCase();
    
    const filtered = rawData.filter(item => {
      // 브랜드 필터
      if (currentBrand !== "ALL") {
        if (currentBrand === "쌍용" && !item.brand.includes("쌍용")) return false;
        if (currentBrand === "KGM" && !item.brand.includes("KGM")) return false;
      }
      // 차종 분류 필터
      if (currentCategory !== "ALL") {
        const patterns = currentCategory.split("|");
        const match = patterns.some(p => item.model.includes(p));
        if (!match) return false;
      }
      // 연료 필터
      if (currentFuel !== "ALL") {
        if (!item.fuel.includes(currentFuel)) return false;
      }
      // 검색어 필터
      if (searchVal) {
        const targetStr = (item.brand + " " + item.model + " " + item.generation + " " + item.fuel + " " + item.displacement + " " + item.engine_code).toLowerCase();
        if (!targetStr.includes(searchVal)) return false;
      }
      return true;
    });

    totalCountEl.textContent = filtered.length;

    if (filtered.length === 0) {
      tbody.innerHTML = "";
      noResults.style.display = "block";
      return;
    }

    noResults.style.display = "none";
    let html = "";
    filtered.forEach(item => {
      html += '<tr>';
      html += '<td data-label="제조사">' + getBrandBadge(item.brand) + '</td>';
      html += '<td data-label="차량명"><strong>' + item.model + '</strong></td>';
      html += '<td data-label="세대">' + item.generation + '</td>';
      html += '<td data-label="연료">' + getFuelBadge(item.fuel) + '</td>';
      html += '<td data-label="배기량">' + item.displacement + '</td>';
      html += '<td data-label="엔진코드"><span class="engine-code-text">' + item.engine_code + '</span></td>';
      html += '</tr>';
    });

    tbody.innerHTML = html;
  }

  // 검색 이벤트
  if (searchInput) {
    searchInput.addEventListener("input", function(e) {
      currentSearch = e.target.value;
      render();
    });
  }

  // 필터 버튼 이벤트
  document.querySelectorAll("#kgm-engine-wrap .kgm-btn-chip").forEach(btn => {
    btn.addEventListener("click", function() {
      const type = this.getAttribute("data-filter-type");
      const val = this.getAttribute("data-val");

      const siblings = this.parentElement.querySelectorAll(".kgm-btn-chip");
      siblings.forEach(s => s.classList.remove("active"));
      this.classList.add("active");

      if (type === "brand") currentBrand = val;
      if (type === "category") currentCategory = val;
      if (type === "fuel") currentFuel = val;
      render();
    });
  });

  // CSV 다운로드 기능
  const csvBtn = document.getElementById("kgm-btn-csv");
  if (csvBtn) {
    csvBtn.addEventListener("click", function() {
      let csvContent = "\uFEFF제조사,차량명,세대,연료,배기량,엔진코드\n";
      rawData.forEach(r => {
        csvContent += `"${r.brand}","${r.model}","${r.generation}","${r.fuel}","${r.displacement}","${r.engine_code}"\n`;
      });
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", "kgm_ssangyong_engine_specs.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  }

  // 클립보드 복사 기능
  const copyBtn = document.getElementById("kgm-btn-copy");
  if (copyBtn) {
    copyBtn.addEventListener("click", function() {
      let text = "제조사\t차량명\t세대\t연료\t배기량\t엔진코드\n";
      rawData.forEach(r => {
        text += `${r.brand}\t${r.model}\t${r.generation}\t${r.fuel}\t${r.displacement}\t${r.engine_code}\n`;
      });
      navigator.clipboard.writeText(text).then(() => {
        alert("전체 데이터가 클립보드로 복사되었습니다. (엑셀/구글 시트에 바로 붙여넣기 가능)");
      }).catch(() => {
        alert("클립보드 복사 권한을 확인해주세요.");
      });
    });
  }

  // 초기 렌더링
  render();
})();
</script>
